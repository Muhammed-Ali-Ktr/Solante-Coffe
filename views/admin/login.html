<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetim Paneli Giriş</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #C3424E;
            --primary-dark: #A9333E;
            --text-color: #1e293b;
            --text-light: #64748b;
            --bg-color: #0f172a;
            --border-color: #e2e8f0;
            --radius: 16px;
            --font: 'Outfit', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-color) 0%, #1e293b 50%, #450a0a 100%);
            padding: 20px;
        }

        .login-container {
            display: flex;
            width: 900px;
            height: 550px;
            background: #ffffff;
            border-radius: var(--radius);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.5s ease-out;
        }

        /* Image/Video Panel */
        .image-panel {
            flex: 1.1;
            position: relative;
            overflow: hidden;
            background-color: #000;
        }

        .image-panel video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.88;
            transition: opacity 0.5s ease;
        }

        .image-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0,0,0,0) 60%, rgba(255,255,255,0.05) 100%);
            pointer-events: none;
        }

        /* Login Panel */
        .login-panel {
            flex: 0.9;
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #ffffff;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: var(--text-light);
        }

        /* Forms */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group label i {
            color: var(--primary-color);
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-family: var(--font);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(195, 66, 78, 0.12);
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        /* Error and Success Messages */
        .form-error {
            padding: 12px 14px;
            border-radius: 8px;
            background: #fef2f2;
            border-left: 4px solid var(--primary-color);
            color: #b91c1c;
            font-size: 13px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 8px;
            animation: slideIn 0.3s ease;
        }

        .form-error.show {
            display: flex;
        }

        .form-success {
            padding: 12px 14px;
            border-radius: 8px;
            background: #f0fdf4;
            border-left: 4px solid #16a34a;
            color: #15803d;
            font-size: 13px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 8px;
            animation: slideIn 0.3s ease;
        }

        .form-success.show {
            display: flex;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(195, 66, 78, 0.2);
            margin-top: 10px;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(195, 66, 78, 0.35);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            background-color: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
            color: #64748b;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Layout */
        @media (max-width: 820px) {
            .login-container {
                flex-direction: column;
                width: 100%;
                max-width: 420px;
                height: auto;
            }

            .image-panel {
                height: 200px;
                flex: none;
            }

            .login-panel {
                padding: 32px 24px;
                flex: none;
            }
            
            .image-panel::after {
                background: linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(255,255,255,0.05) 100%);
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Spooky Video Panel -->
        <div class="image-panel" id="imagePanel">
            <video id="videoPlayer" autoplay loop muted playsinline>
                <source src="/videos/1026.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Form Panel -->
        <div class="login-panel">
            <div class="login-header">
                <i class="fas fa-shield-alt" style="font-size: 2.5rem; color: var(--primary-color); margin-bottom: 12px;"></i>
                <h2>Yönetim Girişi</h2>
                <p>Lütfen kullanıcı bilgilerinizi doğrulayın.</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Kullanıcı Adı
                    </label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="Kullanıcı adınızı girin">
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Şifre
                    </label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Şifrenizi girin">
                </div>
                
                <div class="form-error" id="errorMessage">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText"></span>
                </div>

                <div class="form-success" id="successMessage">
                    <i class="fas fa-check-circle"></i>
                    <span>Giriş başarılı! Yönlendiriliyorsunuz...</span>
                </div>
                
                <button type="submit" class="btn-primary" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    Giriş Yap
                </button>
            </form>
        </div>
    </div>

    <script src="/js/admin-login.js"></script>
</body>
</html>
